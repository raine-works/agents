# Claude's code review: raine-works/agents' reusable workflow, which reviews every pull request against AGENTS.md and
# approves it when nothing it found is left open. Its checks, `code-review / review` and `code-review / approve`; the
# first is required by the repository's ruleset (raine-works/agents, scripts/apply-rulesets.sh).
#
# A pull request that changes this file isn't reviewed (only the default branch's copy runs): a person reviews it.
name: Code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  code-review:
    uses: raine-works/agents/.github/workflows/code-review.yml@master
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    # with:
    #   focus: |
    #     - what else Claude should look for in this repository, as bullets
