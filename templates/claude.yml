# Claude on issues and pull requests: raine-works/agents' reusable workflow. Mention @claude in an issue, a comment or
# a pull request review and Claude answers there, or makes the change and opens a pull request. Only people with
# write access to the repository can start it.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

jobs:
  claude:
    uses: raine-works/agents/.github/workflows/claude.yml@master
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    with:
      # What the repository's checks need installed, and the commands Claude may run (its checks).
      setup: __SETUP__
      allowed-tools: __TOOLS__
