# Raineworks' image pins, called by a raine-works repository's .github/workflows/image-pins.yml (weekly and by hand; the
# raineworks-base skill's templates/workflows/image-pins.yml) where its workflows run a container image directly,
# pinned by digest, such as Home Assistant's validators:
#
#     uses: docker://ghcr.io/home-assistant/hassfest@sha256:<digest> # latest, 2026-11-23
#
# The comment names the tag the digest was taken from, then the date. For each such pin it asks the registry what the
# tag points at now, and when that has moved it opens raineworks/image-pins, moving every moved pin to the tag's
# current digest and date. The pull request's own checks then run the new images, so new rules that the repository
# breaks show there, and it waits for a person; otherwise it merges itself once approved and green.
#
# It needs, from the calling repository (secrets: inherit): DOCS_SYNC_APP_CLIENT_ID and DOCS_SYNC_APP_PRIVATE_KEY, the
# app the pull request is opened as, with Workflows write (one the workflow's own token opened would start no checks).
name: Image pins

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pins:
    name: pins
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: image-pins-${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the pins that moved
        id: pins
        run: |
          # The registry's current digest for image:tag, through its anonymous pull token.
          digest() {
            local registry=${1%%/*} repo=${1#*/} tag=$2 auth realm service token
            local accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'
            [ "$registry" = docker.io ] && registry="registry-1.docker.io"
            auth=$(curl -sS -o /dev/null -D - "https://$registry/v2/" | tr -d '\r' | grep -i '^www-authenticate: bearer' || true)
            realm=$(sed -E 's/.*realm="([^"]+)".*/\1/' <<<"$auth")
            service=$(sed -nE 's/.*service="([^"]+)".*/\1/p' <<<"$auth")
            token=$(curl -sSfG "$realm" --data-urlencode "service=$service" --data-urlencode "scope=repository:$repo:pull" | jq -r '.token // .access_token')
            curl -sSfI -H "Authorization: Bearer $token" -H "Accept: $accept" "https://$registry/v2/$repo/manifests/$tag" \
              | tr -d '\r' | grep -i '^docker-content-digest:' | sed -E 's/^[^:]*: *//'
          }
          today=$(date -u +%F)
          changes=""
          pattern='docker://([a-z0-9.-]+/[a-z0-9._/-]+)@(sha256:[0-9a-f]{64}) # ([A-Za-z0-9._-]+), [0-9]{4}-[0-9]{2}-[0-9]{2}'
          while read -r pin; do
            [[ $pin =~ $pattern ]] || continue
            image=${BASH_REMATCH[1]} pinned=${BASH_REMATCH[2]} tag=${BASH_REMATCH[3]}
            current=$(digest "$image" "$tag") || current=""
            if [ -z "$current" ]; then
              echo "::warning::Couldn't read $image:$tag's digest from its registry; its pin stays."
              continue
            fi
            if [ "$current" = "$pinned" ]; then
              echo "$image:$tag is current."
              continue
            fi
            echo "$image:$tag moved: $pinned -> $current"
            sed -i -E "s|docker://$image@$pinned # $tag, [0-9]{4}-[0-9]{2}-[0-9]{2}|docker://$image@$current # $tag, $today|g" \
              .github/workflows/*.y*ml
            changes+="- \`$image:$tag\`: \`${pinned:7:12}\` → \`${current:7:12}\`"$'\n'
          done < <(grep -hoE "$pattern" .github/workflows/*.y*ml | sort -u)
          if [ -z "$changes" ]; then
            echo "Every image pin is current."
            exit 0
          fi
          {
            echo 'changes<<EOF'
            printf '%s' "$changes"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Use the docs-sync app
        id: sync-app
        if: steps.pins.outputs.changes != ''
        # Without the Workflows permission this fails: the next step warns, and the job still passes.
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Warn without Workflows write
        if: steps.pins.outputs.changes != '' && steps.sync-app.outcome == 'failure'
        run: echo "::warning::Pinned images moved, but the docs-sync app can't change workflow files here (it needs the Workflows write permission), so their pins weren't moved."
      - name: Open the image pins pull request
        id: pr
        if: steps.sync-app.outcome == 'success'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.sync-app.outputs.token }}
          branch: raineworks/image-pins
          base: master
          delete-branch: true
          commit-message: Move pinned images to their tags' current digests
          title: Move pinned images to their tags' current digests
          body: |
            The images this repository's workflows run by digest have moved on their tags, so Image pins moved the pins:

            ${{ steps.pins.outputs.changes }}
            This pull request's checks run the new images. If one fails, the new image asks for something this
            repository doesn't do yet: fix that here, or in a pull request of its own first.
      - name: Merge it once it's approved and green
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.sync-app.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          gh pr merge --auto --merge "$PR_URL" \
            || echo "::warning::Auto-merge isn't allowed in this repository: $PR_URL waits for a person to merge it."
