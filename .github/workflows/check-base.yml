# Raineworks' Base rules check, called by every raine-works repository's .github/workflows/check-base.yml (on every pull request,
# every push to master and every six hours; the raineworks-base skill's templates/workflows/check-base.yml). It checks the
# repository:
# - is wired up: AGENTS.md imports .raineworks/base.md, CLAUDE.md is a symlink to it, and its workflows
#   call each of Raineworks' shared workflows here, pinned to a commit;
# - carries the current base.md (this repository's sync-base.sh --check, against base.md on master).
#
# On master (a push, the schedule or by hand) it fixes what it can, always by pull request and never by editing the
# copy: a stale copy is rewritten by sync-base.sh and opened as raineworks/base-sync, and the check stays failed until
# that's merged; callers pinned to an older version of these workflows are moved to the current one in
# raineworks/workflows-sync (a warning, not a failure). On a pull request it only checks.
#
# raine-works/agents is public, so the job's own token reads it. It needs, from the calling repository (secrets:
# inherit): DOCS_SYNC_APP_CLIENT_ID and DOCS_SYNC_APP_PRIVATE_KEY (the app the sync pull requests are opened as: one the
# workflow's own token opened would start no checks; moving the pins needs its Workflows write permission too).
name: Base rules

on:
  workflow_call:

permissions:
  contents: read

env:
  # The commit of this repository whose sync-base.sh the check runs: a script fetched and run, so pinned, like the
  # actions. Move it when sync-base.sh changes. base.md itself is compared with master's (RAINEWORKS_BASE_REF).
  SYNC_BASE_SHA: d9297c7a55361a5c15bd1b9cf16d8410dadb515d
  # Raineworks' shared workflows, here in .github/workflows/, which every repository calls (release-note.yml is only for
  # repositories with releases, so it isn't asked for).
  SHARED_WORKFLOWS: check-base code-review docs-sync rules-audit

jobs:
  check:
    name: check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: check-base-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Needs nothing from outside, so it always runs.
      - name: Check the base rules and shared workflows are wired up
        run: |
          failed=0
          fail() { echo "::error file=$1::$2"; failed=1; }
          [[ -s .raineworks/base.md ]] || fail .raineworks/base.md ".raineworks/base.md is missing: copy it with raine-works/agents' sync-base.sh"
          grep -qxF '@.raineworks/base.md' AGENTS.md 2>/dev/null \
            || fail AGENTS.md "AGENTS.md must import the base rules on a line of its own: @.raineworks/base.md"
          [[ -L CLAUDE.md && "$(readlink CLAUDE.md)" == AGENTS.md ]] \
            || fail CLAUDE.md "CLAUDE.md must be a symlink to AGENTS.md (ln -s AGENTS.md CLAUDE.md)"
          for workflow in $SHARED_WORKFLOWS; do
            grep -qsE "uses: *raine-works/agents/\.github/workflows/$workflow\.yml@[0-9a-f]{40}" .github/workflows/*.y*ml \
              || fail .github/workflows "No workflow calls raine-works/agents' $workflow.yml, pinned to a commit: add its caller from the raineworks-base skill (templates/workflows/$workflow.yml)"
          done
          exit "$failed"
      # On master a stale copy doesn't stop the job here: the steps below replace it, and the last one fails the run.
      - name: Check the copy is the current base.md
        id: copy
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RAINEWORKS_BASE_REF: master
        run: |
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/raine-works/agents/contents/skills/raineworks-base/scripts/sync-base.sh?ref=$SYNC_BASE_SHA" \
            >"$RUNNER_TEMP/sync-base.sh"
          bash "$RUNNER_TEMP/sync-base.sh" --check
      # Never on a pull request: its branch is fixed by merging master once the sync pull request is in.
      - name: Write the current base.md
        if: steps.copy.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RAINEWORKS_BASE_REF: master
        run: bash "$RUNNER_TEMP/sync-base.sh"
      - name: Use the docs-sync app
        id: sync-app
        if: steps.copy.outcome == 'failure' && github.event_name != 'pull_request'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the sync pull request
        id: pr
        if: steps.sync-app.outcome == 'success'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.sync-app.outputs.token }}
          branch: raineworks/base-sync
          base: master
          delete-branch: true
          commit-message: Sync .raineworks/base.md with raine-works/agents
          title: Sync .raineworks/base.md with raine-works/agents
          body: |
            `base.md` changed in `raine-works/agents`, so the Base rules check wrote the current copy with that
            repository's `sync-base.sh`. Nothing here is edited by hand.

            Read what changed: a new rule may need a change elsewhere in this repository, in a pull request of its own.
          add-paths: .raineworks/base.md
      - name: Fail while the copy is stale
        if: steps.copy.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          echo "::error file=.raineworks/base.md::.raineworks/base.md isn't the current base.md from raine-works/agents: merge ${PR_URL:-the sync pull request}"
          exit 1

  # Keeps every repository on the same version of the shared workflows: when they've changed here since the commit
  # the callers are pinned to, it moves the pins to master's head in a pull request. A warning, never a failure: the
  # older version still runs, and an unrelated change here shouldn't turn every repository red.
  workflows:
    name: workflows
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    continue-on-error: true
    concurrency:
      group: check-base-workflows-${{ github.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Move stale pins to master
        id: pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pattern='raine-works/agents/\.github/workflows/[a-z0-9-]+\.yml@[0-9a-f]{40}'
          latest=$(gh api repos/raine-works/agents/commits/master --jq .sha)
          stale=false
          while read -r sha; do
            [ "$sha" = "$latest" ] && continue
            # Only a change to the workflows themselves moves the pins, not one to the rules or the skills.
            if gh api "repos/raine-works/agents/compare/$sha...$latest" --jq '.files[].filename' | grep -q '^\.github/workflows/'; then
              stale=true
            fi
          done < <(grep -hoE "$pattern" .github/workflows/*.y*ml | sed 's/.*@//' | sort -u)
          if ! $stale; then
            echo "The shared workflows are current."
            exit 0
          fi
          sed -i -E "s#(raine-works/agents/\.github/workflows/[a-z0-9-]+\.yml@)[0-9a-f]{40}#\1$latest#g" .github/workflows/*.y*ml
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      # Changing a workflow file needs the app's Workflows write permission, which plain doc syncs don't.
      - name: Use the docs-sync app
        id: sync-app
        if: steps.pins.outputs.latest != ''
        # Without the Workflows permission this fails: the next step warns, and the job still passes.
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Warn without Workflows write
        if: steps.sync-app.outcome == 'failure'
        run: echo "::warning::The shared workflows changed in raine-works/agents, but the docs-sync app can't change workflow files here (it needs the Workflows write permission), so their pins weren't moved."
      - name: Open the workflows pull request
        if: steps.sync-app.outcome == 'success'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.sync-app.outputs.token }}
          branch: raineworks/workflows-sync
          base: master
          delete-branch: true
          commit-message: Move Raineworks' shared workflows to raine-works/agents@${{ steps.pins.outputs.latest }}
          title: Move Raineworks' shared workflows to their current version
          body: |
            Raineworks' shared workflows changed in `raine-works/agents`, so the Base rules check moved this repository's
            callers to `raine-works/agents@${{ steps.pins.outputs.latest }}`. Only the pins change.

            Claude can't review it, since it changes Code review's own caller; Code review checks instead that it only
            moves pins to commits on agents' master, and approves it.
          add-paths: .github/workflows/*
