# Claude on issues and pull requests, for every raine-works repository: a reusable workflow each one calls from its own
# `.github/workflows/claude.yml` (templates/claude.yml). Mention @claude in an issue (its title or body), a comment, or
# a pull request review, and Claude answers there: it reads the repository (AGENTS.md first), explains, reviews, or
# makes the change on a branch and opens a pull request for it. Only people with write access to the repository can
# start it (anthropics/claude-code-action checks the commenter's permission), so a stranger's @claude on a public issue
# does nothing.
#
# It signs in to Anthropic with the job's OIDC token (workload identity federation): no API key is stored. It answers,
# commits and pushes as claude[bot] (the Claude GitHub App, installed on the repository, as Code review is), not the
# workflow's own token: a branch that token pushed would start no checks.
name: Claude

on:
  workflow_call:
    inputs:
      setup:
        description: >-
          Shell commands that install what the repository's checks need (e.g. `pip install -r requirements.txt`), run
          before Claude starts. Empty for none.
        type: string
        default: ''
      setup-action:
        description: Run the repository's own `.github/actions/setup` action first.
        type: boolean
        default: false
      allowed-tools:
        description: >-
          The commands Claude may run, as Claude Code rules (e.g. 'Bash(pytest),Bash(ruff check .)'): the repository's
          checks, and nothing that reaches outside it. Empty for none.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  claude:
    name: Claude
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
      || (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
      || (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One run per issue or pull request at a time: a second mention waits for the first to finish.
    concurrency:
      group: claude-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # To read the checks' results on a pull request.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: inputs.setup-action
        uses: ./.github/actions/setup
      - if: inputs.setup != ''
        name: Set up
        env:
          SETUP: ${{ inputs.setup }}
        run: bash -euo pipefail -c "$SETUP"
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          # Workload identity federation: the job's GitHub OIDC token (id-token: write) is exchanged for a
          # short-lived Anthropic one. These are identifiers, not secrets.
          anthropic_federation_rule_id: fdrl_015cLigViCEJyWAtahH5ytSC
          anthropic_organization_id: 34318a61-fac0-4077-a795-808d80efef19
          anthropic_service_account_id: svac_015F3BEwDj2EJr7bHDgKmFkL
          anthropic_workspace_id: wrkspc_01G5WKL4tLYspnSa4BYdzUCS
          # Lets Claude see why a pull request's checks failed.
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            ${{ inputs.allowed-tools && format('--allowedTools "{0}"', inputs.allowed-tools) || '' }}
