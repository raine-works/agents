# Claude on issues and pull requests: mention @claude in an issue (its title or body), a comment, or a pull request
# review, and Claude answers there. It reads the repository (AGENTS.md first), explains, reviews, or makes the change
# on a branch for a pull request. A reply on one of Code review's own threads that mentions @claude is answered here;
# Code review leaves those alone.
#
# Raineworks' shared @claude workflow, called by a raine-works repository's .github/workflows/claude.yml (on issues, issue and
# pull request comments, and reviews; the raineworks-base skill's templates/workflows/claude.yml), which grants it
# contents: write, pull-requests: write, issues: write, id-token: write and actions: read. It signs in to Anthropic
# with the job's OIDC token (workload identity federation): no secret. It answers, commits and pushes as claude[bot]
# (the Claude GitHub App, which Code review needs too), never with the workflow's own token: a branch that token
# pushed would start no checks, so a pull request from it could never pass them.
name: Claude

on:
  workflow_call:
    inputs:
      allowed-commands:
        description: >-
          The commands Claude may run besides reading and editing files, as Claude Code Bash rules separated by commas.
          Without it, a Bun project's: installing, formatting and its checks (raineworks').
        type: string
        default: >-
          Bash(bun install),Bash(bun run format),Bash(bun run lint),Bash(bun run lint:fix),Bash(bun run typecheck),Bash(bun run test)

permissions:
  contents: read

jobs:
  claude:
    name: claude
    # One run per issue or pull request at a time; a mention made while one runs waits for it.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # Lets it read CI results (the action's github_ci tools).
      actions: read
    # Only a mention by someone with a say in the repository (an owner, member or collaborator: not just anyone who can
    # comment on a public one), never a bot's. The action checks they have write access too.
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        github.event.review.user.type != 'Bot' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        github.event.issue.user.type != 'Bot' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A mention on an open issue is Issue to PR's where the repository's caller starts on it (an issue opened with it,
      # or, if the caller listens for issue comments, a comment): Issue to PR works the issue into a pull request it
      # sees through review, and answering here too would make two. Anything else (a pull request, a closed issue, an
      # assignment, a caller without the trigger) is answered here.
      - id: route
        name: Leave issues to Issue to PR
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ON_OPEN_ISSUE: ${{ !github.event.issue.pull_request && github.event.issue.state == 'open' }}
        run: |
          # The caller is whichever workflow calls Issue to PR, whatever its file is named.
          caller=$(grep -lE 'uses:[[:space:]]*raine-works/agents/\.github/workflows/issue-to-pr\.yml@' \
            .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null | head -n 1 || true)
          theirs=false
          if [ "$ON_OPEN_ISSUE" = true ] && [ -n "$caller" ]; then
            if [ "$EVENT" = issues ] && [ "$ACTION" = opened ]; then
              theirs=true
            elif [ "$EVENT" = issue_comment ] && grep -qE '^[[:space:]]*issue_comment:' "$caller"; then
              theirs=true
            fi
          fi
          if $theirs; then
            echo "Issue to PR answers this mention ($caller starts on it)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # The calling repository's own action, if it has one (a local path is read from the checkout, not from
      # raine-works/agents): what its commands need installed.
      - uses: ./.github/actions/setup
        if: steps.route.outputs.run == 'true' && hashFiles('.github/actions/setup/action.yml', '.github/actions/setup/action.yaml') != ''
      - if: steps.route.outputs.run == 'true'
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          # Workload identity federation: the job's GitHub OIDC token (id-token: write) is exchanged for a
          # short-lived Anthropic one. These are identifiers, not secrets.
          anthropic_federation_rule_id: fdrl_015cLigViCEJyWAtahH5ytSC
          anthropic_organization_id: 34318a61-fac0-4077-a795-808d80efef19
          anthropic_service_account_id: svac_015F3BEwDj2EJr7bHDgKmFkL
          anthropic_workspace_id: wrkspc_01G5WKL4tLYspnSa4BYdzUCS
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "${{ inputs.allowed-commands }}"
