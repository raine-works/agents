# This repository's own code review: the reusable workflow beside this one, as master has it. Its pull requests also
# need the owner's review (CODEOWNERS): they change what every repository's review does.
name: Code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  code-review:
    uses: raine-works/agents/.github/workflows/code-review.yml@master
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    with:
      caller: .github/workflows/review.yml
      focus: |
        - a change to a reusable workflow that gives Claude, or code from a pull request, more than its job needs, or
          that would let the review approve something it hasn't reviewed;
        - a shared rule that contradicts another, or one a repository couldn't follow.
