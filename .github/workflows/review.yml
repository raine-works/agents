# This repository's own code review: the shared one beside this file, as master has it (so a pull request here is
# reviewed by the review it doesn't change, never by its own copy). Its pull requests also need the owner's review
# (CODEOWNERS): they change what every repository's rules, review and approval are.
name: Code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

jobs:
  code-review:
    name: Code review
    # master, not a commit: this repository's review is always master's latest, which the owner reviewed.
    uses: raine-works/agents/.github/workflows/code-review.yml@master
    secrets: inherit
    with:
      focus: |
        - a reusable workflow that gives Claude, or code from a pull request, a token, permission or tool beyond its
          job, or that lets `approve` approve something Claude didn't finish reviewing;
        - an action or a fetched script not pinned to a commit;
        - a rule in base.md that contradicts another, or that a repository couldn't follow or check;
        - a template, the skill or the README that no longer matches the workflows.
