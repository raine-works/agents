# After master's checks pass, Claude checks whether what's new on master made any of the repo's docs wrong (the
# ones AGENTS.md lists and the packages' READMEs) and, if so, opens (or updates) one pull request fixing them. It
# never pushes to master itself.
#
# It follows CI (workflow_run), not the push: Claude's action doesn't take push events. What's new is
# everything since the last commit it ran for: the previous successful run's. An open docs-sync pull request's fixes
# are carried into each run, which adds to them: the pull request is rewritten from what the run leaves, so without
# them a run that finds nothing new would close it and drop them.
#
# Raineworks' shared docs sync, called by every raine-works repository's .github/workflows/docs-sync.yml (after its CI, and by
# hand; the raineworks-base skill's templates/workflows/docs-sync.yml), which grants it contents: write,
# pull-requests: write, id-token: write and actions: read. It signs in to Anthropic with the job's OIDC token
# (workload identity federation). Needs the docs-sync app (DOCS_SYNC_APP_CLIENT_ID, DOCS_SYNC_APP_PRIVATE_KEY), from
# secrets: inherit or the organization.
name: Docs sync

on:
  workflow_call:
    inputs:
      docs:
        description: The repository's docs, as prose for Claude. Without it, a general list.
        type: string
        default: >-
          AGENTS.md and any AGENTS.md below it (rules), README.md and every package's or module's README.md,
          STYLEGUIDE.md if there is one, and docs/*.md.

permissions:
  contents: read

jobs:
  sync:
    name: sync
    concurrency:
      group: docs-sync
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
    # Only for a push to master whose checks passed, and not for its own merged pull requests or releases.
    # A repository without CI calls it after its Base rules check, which runs on every push to master (Claude's
    # action doesn't take push events). Its own and the syncs' changes are skipped whether they were squashed (their
    # subject) or merged (the branch in the merge's subject).
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        !startsWith(github.event.workflow_run.head_commit.message, 'Sync docs') &&
        !startsWith(github.event.workflow_run.head_commit.message, 'Release ') &&
        !startsWith(github.event.workflow_run.head_commit.message, 'Sync .raineworks/') &&
        !startsWith(github.event.workflow_run.head_commit.message, 'Move Raineworks') &&
        !contains(github.event.workflow_run.head_commit.message, '/claude/docs-sync') &&
        !contains(github.event.workflow_run.head_commit.message, '/raineworks/base-sync') &&
        !contains(github.event.workflow_run.head_commit.message, '/raineworks/workflows-sync') &&
        !contains(github.event.workflow_run.head_commit.message, '/release-note/')
      )
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      # Its pull request is opened as the docs-sync GitHub App, never with the workflow's own token: GitHub doesn't let
      # that token open one here, and a pull request it opened would start no checks. So without the app there's
      # nothing this run could finish: say so now, before Claude spends any time.
      - name: Check the docs-sync app is set up
        env:
          CLIENT_ID: ${{ vars.DOCS_SYNC_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != true ]; then
            echo "::error::The docs-sync GitHub App isn't set up: set the DOCS_SYNC_APP_CLIENT_ID variable and the DOCS_SYNC_APP_PRIVATE_KEY secret, and install the app on this repository (raine-works/agents' README, "Shared workflows")."
            exit 1
          fi
      # And installed on this repository: a token that can only read its metadata, to find out now rather than after
      # Claude's step. The token the pull request is opened with is made only after it.
      - name: Check the docs-sync app is installed
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          permission-metadata: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          # The pull request is opened (and pushed) with its own token, in its own step: the checkout's
          # contents: write token isn't left in .git/config while Claude runs.
          persist-credentials: false
      # The open pull request's fixes, staged on top of this commit (a closed one's never come back). Its commits name
      # where it began (a `Docs-Sync-Since:` trailer, written below): each run rebuilds it on its own commit, so its
      # merge base is only the last run's. If its fixes no longer apply (master changed the same lines), they're
      # dropped, and this run looks again at everything since it began.
      - name: Keep the open pull request's fixes
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: origin/claude/docs-sync
        run: |
          open="$(gh pr list --head claude/docs-sync --state open --json number --jq length)"
          if [ "$open" != 1 ] || ! git rev-parse -q --verify "$BRANCH" >/dev/null; then
            echo "No open docs-sync pull request."
            exit 0
          fi
          # Its newest commit with the trailer: one pushed on top (a review fix, master merged in) has none.
          began="$(git log --format='%(trailers:key=Docs-Sync-Since,valueonly)' "HEAD..$BRANCH" | grep -m 1 . || true)"
          if ! git rev-parse -q --verify "${began:-none}^{commit}" >/dev/null; then began="$(git merge-base "$BRANCH" HEAD)"; fi
          echo "began=$began" >> "$GITHUB_OUTPUT"
          if git merge --squash "$BRANCH" >/dev/null 2>&1; then
            echo "Kept its fixes: $(git diff --cached --name-only | paste -sd ' ' -)."
          else
            git reset -q --hard HEAD
            echo "Its fixes no longer apply: looking again since it began ($began)."
            echo "since=$began" >> "$GITHUB_OUTPUT"
          fi
      - name: What's new
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          OPEN_SINCE: ${{ steps.open.outputs.since }}
          OPEN_BEGAN: ${{ steps.open.outputs.began }}
        run: |
          # Where a dropped pull request began, else the commit this workflow last ran for (its previous successful
          # run), else just the latest commit.
          since="${OPEN_SINCE:-$(gh run list --workflow docs-sync.yml --branch master --status success --limit 1 --json headSha --jq '.[0].headSha // empty')}"
          if [ -z "$since" ] || ! git merge-base --is-ancestor "$since" "$HEAD_SHA"; then since="$HEAD_SHA~1"; fi
          # Where the pull request this run opens or updates began: the open one's start, else this range's.
          echo "began=$(git rev-parse "${OPEN_BEGAN:-$since}")" >> "$GITHUB_OUTPUT"
          echo "range=$since..$HEAD_SHA" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        id: claude
        with:
          # Workload identity federation: the job's GitHub OIDC token (id-token: write) is exchanged for a
          # short-lived Anthropic one. These are identifiers, not secrets.
          anthropic_federation_rule_id: fdrl_015cLigViCEJyWAtahH5ytSC
          anthropic_organization_id: 34318a61-fac0-4077-a795-808d80efef19
          anthropic_service_account_id: svac_015F3BEwDj2EJr7bHDgKmFkL
          anthropic_workspace_id: wrkspc_01G5WKL4tLYspnSa4BYdzUCS
          # master's pushes are now often merges GitHub made for our bots' pull requests (auto-merge), so
          # the run's actor is a bot, which the action refuses unless it's named here. Only ours: never '*'.
          allowed_bots: raineworks-doc-sync,claude
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            These commits are new on master: `git log ${{ steps.range.outputs.range }}`.
            Read their diffs (`git show`).

            Check whether they made anything in the repo's docs wrong or incomplete: ${{ inputs.docs }}
            AGENTS.md says which doc covers what. Where a README disagrees with the code, the code is right.
            Never touch .raineworks/ (Raineworks' base rules, a copy kept by its own sync).

            If something is now wrong or missing, fix it in place, in the voice of the doc around it. Each fact
            belongs in one doc: link rather than repeat. Don't restructure, reword what's still right, or write
            about what didn't change. Don't touch release notes or code.

            The working tree may already hold fixes from the open docs-sync pull request (`git diff HEAD` shows
            them): keep them, unless these commits made one wrong.

            If nothing needs changing, change nothing.
          # Claude edits only Markdown at the root, in docs/ and the READMEs and AGENTS.md files below it (a leading / is
          # the repository root), never .raineworks/, .git, code or release notes. No `Bash(git …:*)` rules: a rule matches by prefix whatever
          # options follow (`git diff --output=<file>` writes anywhere), and without one Claude Code's own read-only
          # check runs git log, show and diff and refuses those options.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Edit(/*.md),Write(/*.md),Edit(/docs/**/*.md),Write(/docs/**/*.md),Edit(/**/README.md),Write(/**/README.md),Edit(/**/AGENTS.md),Write(/**/AGENTS.md)"
            --disallowedTools "Agent,Task,Workflow,Edit(/.raineworks/**),Write(/.raineworks/**)"
      # A failed run says why, from its log: Anthropic refusing the request (a spending or rate limit, billing, the
      # model), which the action's own output hides
      - name: Say why Claude's run failed
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          LOG: ${{ steps.claude.outputs.execution_file }}
        run: |
          [ -f "$LOG" ] || exit 0
          # The API's error kind (billing_error, rate_limit, authentication_failed…) and its message; a run that failed
          # later only its failure (error_max_turns…), and a working run nothing: their words can hold what tools read
          why="$(jq -r '([.[] | select(.type == "assistant") | .error // empty] | unique | join(", ")) as $api
            | ([.[] | select(.type == "result")] | last) as $r
            | if $r.is_error == false then empty
              elif $api != "" or ($r.num_turns // 0) <= 1 then [$api, ($r.result // "")] | map(select(. != "")) | join(": ")
              else $r.subtype // "" end' "$LOG" \
            | tr '\r\n' '  ' | sed 's/^ *//; s/ *$//' | cut -c1-500 | sed 's/%/%25/g')"
          echo "::error title=Why Claude's run failed::${why:-No reason in its log; see the Claude step}"
      # The pull request is opened (or pushed to) as the docs-sync GitHub App (raine-works/agents' README, "Shared workflows"),
      # its token made only now, so Claude's step never had it.
      - name: Use the docs-sync app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the pull request
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app.outputs.token }}
          branch: claude/docs-sync
          # Checked out on the commit CI passed, not a branch: the pull request is against master.
          base: master
          delete-branch: true
          commit-message: |
            Sync docs with master

            Docs-Sync-Since: ${{ steps.range.outputs.began }}
          title: Sync docs with master
          body: |
            Claude found docs that `${{ steps.range.outputs.range }}` made wrong or incomplete, and fixed them.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          labels: documentation
          # Every Markdown file Claude may have changed (git's `*` crosses folders: docs/, nested READMEs and AGENTS.md
          # too), as one pattern that always matches: `git add` fails on a pattern that matches nothing, and
          # `**/AGENTS.md` matches no AGENTS.md at the root. What Claude may change at all is its allowedTools above.
          add-paths: '*.md'
      # Merged by GitHub once it's approved and its checks pass, with nobody to wait for (a person's own pull requests
      # stay theirs to merge). Where the repository doesn't allow auto-merge, it waits for a person instead.
      - name: Merge it once it's approved and green
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          gh pr merge --auto --merge "$PR_URL" \
            || echo "::warning::Auto-merge isn't allowed in this repository: $PR_URL waits for a person to merge it."
