# This repository's own Issue to PR: the shared workflow beside this file, as master has it (like review.yml). An issue
# opened by the owner, any issue once it's labelled `claude` (as the rules audit's is), or an issue the owner (or a
# collaborator) comments `@claude` on is worked by Claude into a pull request, which Claude then sees through its
# checks and Code review's findings until it's approved. Claude can't change workflows (.github/workflows/**), which
# is most of this repository: an issue that needs one gets a comment saying so, for a person.
name: Issue to PR

on:
  issues:
    types: [opened, labeled]
  # An @claude comment on an issue
  issue_comment:
    types: [created]
  # Its follow-up: after the review, and after this repository's checks, on Claude's pull requests.
  workflow_run:
    workflows: [Code review, actionlint]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  issue-to-pr:
    name: Issue to PR
    uses: raine-works/agents/.github/workflows/issue-to-pr.yml@master
    secrets: inherit
    with:
      allowed-commands: >-
        Bash(actionlint .github/workflows/*.yml skills/raineworks-base/templates/workflows/*.yml),Bash(shellcheck scripts/*.sh skills/raineworks-base/scripts/*.sh),Bash(jq empty repos.json rulesets/*.json)
