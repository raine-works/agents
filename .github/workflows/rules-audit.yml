# Raineworks' rules audit, called by every raine-works repository's .github/workflows/rules-audit.yml (weekly, after CI passes on
# a push to master, and by hand; the raineworks-base skill's templates/workflows/rules-audit.yml). Claude checks master
# against Raineworks' base rules (.raineworks/base.md) and the repository's own, and one issue labelled rules-audit stays open
# while it finds something they're broken by: opened when it first does, its description replaced as the findings
# change, closed once an audit finds nothing. After CI it audits only when the push changed a rules file.
#
# Claude only reads: it writes its findings to one file, and a second job, which Claude never runs in, turns them into
# the issue with a token that can write issues and nothing else. Where the repository calls Issue to PR
# (issue-to-pr.yml), that job then labels the issue `claude` as the docs-sync app, so Claude works the findings into a
# pull request with nobody starting it: when the issue is opened, and again when its findings change while no pull
# request of Issue to PR's is open for it. (The workflow's own token would start nothing: GitHub runs no workflow on its
# events.) Needs the docs-sync app with Issues write (DOCS_SYNC_APP_CLIENT_ID, DOCS_SYNC_APP_PRIVATE_KEY); without it,
# a warning, and the issue waits for someone to label it. It signs in to Anthropic with the job's OIDC token
# (workload identity federation, which is what id-token: write is for): no secret.
name: Rules audit

on:
  workflow_call:
    inputs:
      rules:
        description: The rules files, space-separated, from the repository's root. A push that changes one is audited.
        type: string
        default: .raineworks/base.md AGENTS.md
      checklist:
        description: What else to check in this repository (its own rules that a search can find broken), as prose.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  audit:
    name: audit
    # After CI, only for a push to master whose checks passed.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    concurrency:
      group: rules-audit
    permissions:
      contents: read
      id-token: write
      # The latest runs on master (the facts below).
      actions: read
    outputs:
      findings: ${{ steps.findings.outputs.json }}
      sha: ${{ steps.facts.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      # After CI, only when the commit changed the rules (a merge, compared with master before it): otherwise the
      # weekly run is enough.
      - name: Did the rules change
        id: gate
        env:
          RULES: ${{ inputs.rules }}
        run: |
          # RULES is a list of paths: split on spaces on purpose.
          # shellcheck disable=SC2086
          if [ "$GITHUB_EVENT_NAME" != workflow_run ] || ! git diff --quiet HEAD^1 HEAD -- $RULES; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "The rules didn't change: nothing to audit until the weekly run."
          fi
      # What Claude can't read from the files: how GitHub protects master, and how its latest checks went.
      - name: Gather the repository's settings
        id: facts
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg defaultBranch "$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)" \
            --argjson masterRules "$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/master" --jq '[.[] | {type, parameters}]')" \
            --argjson latestOnMaster "$(gh run list --branch master --limit 40 --json workflowName,conclusion,headSha,createdAt \
              --jq 'group_by(.workflowName) | map(max_by(.createdAt))')" \
            '{defaultBranch: $defaultBranch, masterRules: $masterRules, latestOnMaster: $latestOnMaster}' \
            > rules-audit-facts.json
          cat rules-audit-facts.json
      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        if: steps.gate.outputs.run == 'true'
        with:
          # Workload identity federation: the job's GitHub OIDC token (id-token: write) is exchanged for a
          # short-lived Anthropic one. These are identifiers, not secrets.
          anthropic_federation_rule_id: fdrl_015cLigViCEJyWAtahH5ytSC
          anthropic_organization_id: 34318a61-fac0-4077-a795-808d80efef19
          anthropic_service_account_id: svac_015F3BEwDj2EJr7bHDgKmFkL
          anthropic_workspace_id: wrkspc_01G5WKL4tLYspnSa4BYdzUCS
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Audit this repository (checked out at master) against the rules it must follow: ${{ inputs.rules }}.
            .raineworks/base.md is Raineworks' base rules; where the repository's own rules are more specific, they win, as
            AGENTS.md says. Read them all first.

            rules-audit-facts.json holds what the files can't tell you: the default branch, the rules GitHub enforces
            on master (masterRules) and the latest run of each workflow on master.

            Go through the rules one by one, and check every one that can be checked from the files and those facts,
            for each stack the repository uses (the base rules' "Adapt to the project"):
            - the setup: the required workflows (callers of raine-works/agents' shared workflows), CLAUDE.md a
              symlink to AGENTS.md, AGENTS.md importing @.raineworks/base.md, master protected, docs/ (with its
              docs/README.md index) and the READMEs;
            - pinning: exact versions and a committed lockfile, the language and package manager's version, actions
              and reusable workflows by commit SHA, base images by digest;
            - the toolchain and tests: no tool the rules rule out, the type checker's strict settings, tests for
              what the rules say needs them, a coverage threshold (where there is one) never lowered;
            - images, if there are any: distroless where they can be, pinned by digest, non-root;
            - CI: no pull_request job that installs, builds or tests the branch gets a secret or a write token;
            - the repository's own rules: search the source (Grep) for what they forbid;
            - the rules files themselves: AGENTS.md holds only the repository's own rules (the base rules'
              "Documentation"), so a rule in AGENTS.md (or another of the repository's rules files) that only restates
              what .raineworks/base.md already says is a finding. Give both places (the AGENTS.md line, and the
              base.md section it repeats) and, as the fix, removing it from AGENTS.md. A rule that's more specific
              than the base rule (a stricter limit, this repository's tool, path or command, an exception the base
              rules allow) isn't a repeat: keep it, or report only the part that repeats.
            ${{ inputs.checklist }}

            Report only what you verified, at a file and line where there is one. Don't report a rule you couldn't
            check, anything a rule itself allows (its exceptions), git-ignored files, or style preferences no rule
            states. A finding someone would have to argue away is worse than one missed.

            Write your findings, and nothing else, to rules-audit.json, as
            {"findings": [{"rule": "...", "source": ".raineworks/base.md | AGENTS.md | ...", "location": "path:line",
            "problem": "...", "fix": "..."}]}, with an empty array when you found nothing. Change no other file.
          # Read-only but for its one output file (a leading / is the repository root). No Bash: it greps with its own
          # tools, and the issue is written by the next job, which it never runs in.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Read,Glob,Grep,Write(/rules-audit.json),Edit(/rules-audit.json)"
            --disallowedTools "Agent,Task,Workflow"
      - name: Read the findings
        id: findings
        if: steps.gate.outputs.run == 'true'
        run: |
          jq -e '.findings | type == "array" and all(.[]; (.rule | type) == "string" and (.problem | type) == "string")' \
            rules-audit.json >/dev/null || { echo "::error::rules-audit.json isn't a list of findings"; exit 1; }
          echo "$(jq '.findings | length' rules-audit.json) finding(s)"
          {
            echo "json<<EOF_$GITHUB_RUN_ID"
            jq -c . rules-audit.json
            echo "EOF_$GITHUB_RUN_ID"
          } >> "$GITHUB_OUTPUT"

  report:
    name: report
    needs: audit
    # Only when an audit ran and finished: one that failed never closes the issue.
    if: needs.audit.outputs.findings != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FINDINGS: ${{ needs.audit.outputs.findings }}
          SHA: ${{ needs.audit.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label=rules-audit
          count=$(jq '.findings | length' <<<"$FINDINGS")
          issue=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$count" -eq 0 ]; then
            echo "Nothing found."
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "The [audit]($RUN_URL) of $SHA found nothing: closing."
              # Nothing is left for a person either.
              gh issue edit "$issue" --remove-label needs-person >/dev/null 2>&1 || true
            fi
            exit 0
          fi
          {
            echo "The [rules audit]($RUN_URL) of \`$SHA\` found $count place(s) where this repository doesn't follow"
            echo "Raineworks' base rules (\`.raineworks/base.md\`) or its own (\`AGENTS.md\`). Fix each in a pull request; this"
            echo "issue is updated by every audit and closed by the first that finds nothing."
            echo
            jq -r '.findings | to_entries[] |
              "### \(.key + 1). \(.value.rule)\n\n" +
              "**Where:** `\(.value.location // "the repository")` · **Rule in:** `\(.value.source // "?")`\n\n" +
              "\(.value.problem)\n\n" +
              (if .value.fix then "**Fix:** \(.value.fix)\n" else "" end)' <<<"$FINDINGS"
          } > body.md
          gh label create "$label" --color D93F0B --description "The rules audit found this repository breaking a rule" --force
          if [ -z "$issue" ]; then
            url=$(gh issue create --title "Rules audit: $count rule(s) not followed" --label "$label" --body-file body.md)
            echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          elif [ "$(gh issue view "$issue" --json body --jq .body | tail -n +4)" != "$(tail -n +4 body.md)" ]; then
            gh issue edit "$issue" --title "Rules audit: $count rule(s) not followed" --body-file body.md
            gh issue comment "$issue" --body "The [audit]($RUN_URL) of $SHA found something different: the description is updated."
            echo "number=$issue" >> "$GITHUB_OUTPUT"
          else
            echo "The same findings as issue #$issue already lists."
          fi
      # Only for an issue opened or changed just now: the same findings again start nothing, so an issue Claude
      # couldn't fix isn't worked over and over.
      - name: Does the repository call Issue to PR
        id: issue-to-pr
        if: steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          if ! gh api "repos/$GH_REPO/contents/.github/workflows/issue-to-pr.yml" --silent 2>/dev/null; then
            echo "No issue-to-pr.yml here: the issue waits for a person."
          elif [ -n "$(gh pr list --head "claude/issue-$NUMBER" --state open --json number --jq '.[].number')" ]; then
            echo "Issue to PR's pull request for #$NUMBER is open already: its follow-up carries on."
          else
            echo "work=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Use the docs-sync app
        id: app
        if: steps.issue-to-pr.outputs.work == 'true'
        # Without the app, or its Issues write permission, this fails: the next step warns, and the job still passes.
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          permission-issues: write
      - name: Warn without the app
        if: steps.app.outcome == 'failure'
        run: echo "::warning::The docs-sync app can't write issues here (it needs the Issues write permission), so the rules audit's issue wasn't labelled claude for Issue to PR. Label it by hand."
      # Removed first, so adding it is a `labeled` event even on an issue that has it: that's what starts Issue to PR.
      - name: Hand the issue to Issue to PR
        if: steps.app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          gh label create claude --color 7C3AED --description "Claude works this issue into a pull request (Issue to PR)" --force
          gh issue edit "$NUMBER" --remove-label claude >/dev/null 2>&1 || true
          gh issue edit "$NUMBER" --add-label claude
          echo "Labelled #$NUMBER claude: Issue to PR works it into a pull request."
