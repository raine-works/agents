# Lints the workflows (with shellcheck, for their `run` steps), the callers' templates, the scripts and the JSON.
name: actionlint

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          # The release's archive, checked against its SHA-256 (a tag can move; this can't), as .github/actions/setup
          # installs it
          curl -sSfL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color .github/workflows/*.yml skills/raineworks-base/templates/workflows/*.yml
      - name: shellcheck
        run: shellcheck scripts/*.sh skills/raineworks-base/scripts/*.sh
      - name: JSON
        run: jq empty repos.json rulesets/*.json
