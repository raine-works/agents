# Claude reviews every pull request against the rules, and answers replies to its comments. The workflow is Raineworks', in
# raine-works/agents (.github/workflows/code-review.yml): this file only calls it, and comes from the raineworks-base skill's
# templates/workflows/code-review.yml. Change the workflow there, for every repository at once; here, only its inputs
# (with:). The Base rules check moves the pin when the shared workflows change.
name: Code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write
  actions: read

jobs:
  code-review:
    name: Code review
    uses: raine-works/agents/.github/workflows/code-review.yml@AGENTS_SHA # raine-works/agents master
    secrets: inherit
    # with:
    #   focus: |
    #     - what matters most to review in this repository, most important first
